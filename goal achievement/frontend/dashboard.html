<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoalMate Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 30px;
        }

        .dashboard {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
            margin-bottom: 5px;
        }

        .header p {
            color: #64748b;
            margin-bottom: 8px;
        }

        .header a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            margin-right: 15px;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-card h3 {
            color: #64748b;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            color: #1e293b;
        }

        .section-header p {
            color: #64748b;
            margin-top: 5px;
        }

        .button {
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #1d4ed8;
        }

        #todayTasks {
            color: #475569;
        }

        .goals-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .goal-card {
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
        }

        .goal-card h3 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .goal-card p {
            color: #475569;
            margin-bottom: 7px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress {
            height: 100%;
            background: #2563eb;
            border-radius: 10px;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->
        <div class="header">

            <h1>Dashboard</h1>

            <p>Track your goals and tasks</p>

            <a href="tasks.html">
                Manage Tasks
            </a>

            <a href="achievements.html">
                Achievements
            </a>

        </div>


        <!-- STATISTICS -->
        <div class="stats">

            <div class="stat-card">

                <h3>Total Tasks</h3>

                <div
                    id="totalTasks"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Completed Tasks</h3>

                <div
                    id="completedTasks"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>For Today</h3>

                <div
                    id="todayTaskCount"
                    class="stat-number"
                >
                    0
                </div>

            </div>

        </div>


        <!-- TODAY'S TASKS -->
        <div class="section">

            <div class="section-header">

                <div>

                    <h2>Today's Tasks</h2>

                    <p>
                        Complete your tasks for today
                    </p>

                </div>

                <a
                    href="tasks.html"
                    class="button"
                >
                    + Manage Tasks
                </a>

            </div>


            <div id="todayTasks">
                Loading tasks...
            </div>

        </div>


        <!-- MY GOALS -->
        <div class="section">

            <div class="section-header">

                <div>

                    <h2>My Goals</h2>

                    <p>
                        Track your goal progress
                    </p>

                </div>

                <a
                    href="create-goal.html"
                    class="button"
                >
                    + Create Goal
                </a>

            </div>


            <div
                id="goalsContainer"
                class="goals-container"
            >

                <p id="goalsPlaceholder">
                    Your goals will appear here.
                </p>

            </div>

        </div>

    </div>


    <!-- IMPORTANT -->
    <!-- JavaScript file must be dashboard.js -->

    <script src="dashboard.js"></script>

</body>

</html>
