<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoalMate - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            /* Background Image */
            background-image: url("background-bg.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 400px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.94);

            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.30);
        }

        .register-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #334155;
        }

        .register-container label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        .register-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        .register-container input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .register-container button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-container button:hover {
            background: #1d4ed8;
        }

        #registerMessage {
            text-align: center;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            color: #475569;
        }

        .login-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>GoalMate</h1>

        <h2>Create Account</h2>

        <form id="registerForm">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="registerMessage"></p>

        <div class="login-link">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </div>

    </div>

    <script src="register.js"></script>

</body>
</html>
