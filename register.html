<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Personal Goal Achievement Platform</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.45),
                    rgba(15, 23, 42, 0.45)
                ),
                url("images/goal-background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1050px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 50px;
        }

        .left-content {
            color: white;
            width: 50%;
        }

        .left-content h1 {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .left-content p {
            font-size: 19px;
            line-height: 1.6;
            max-width: 500px;
            color: #f1f5f9;
        }

        .tagline {
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #e2e8f0;
        }

        .register-card {
            width: 390px;
            background: rgba(255, 255, 255, 0.97);

            border-radius: 20px;
            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo-circle {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #172554;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 30px;
        }

        .register-card h2 {
            color: #172554;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #172554;
            box-shadow: 0 0 0 3px rgba(23, 37, 84, 0.1);
        }

        .register-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #172554;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-button:hover {
            background: #1e3a8a;
            transform: translateY(-1px);
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 10px;

            border-radius: 7px;

            font-size: 14px;
        }

        .error-message {
            color: #b91c1c;
            background: #fee2e2;
        }

        .success-message {
            color: #166534;
            background: #dcfce7;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #172554;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;

            margin-top: 15px;

            font-size: 13px;

            color: #64748b;
            text-decoration: none;
        }

        .home-link:hover {
            color: #172554;
        }

        @media (max-width: 800px) {
            body {
                padding: 20px;
            }

            .page-wrapper {
                flex-direction: column;
                gap: 25px;
            }

            .left-content {
                width: 100%;
                text-align: center;
            }

            .left-content h1 {
                font-size: 34px;
            }

            .left-content p {
                margin: auto;
                font-size: 16px;
            }

            .register-card {
                width: 100%;
                max-width: 390px;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <div class="left-content">
            <h1>Build Your Goals.<br>Achieve Your Future.</h1>

            <p>
                Create your personal goals, organize your tasks,
                track your progress and celebrate every achievement.
            </p>

            <div class="tagline">
                Start today. Stay consistent. Achieve more.
            </div>
        </div>


        <div class="register-card">

            <div class="logo-circle">
                🎯
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">
                Start your personal goal journey today
            </p>


            <form id="registerForm">

                <div class="form-group">
                    <label for="registerName">Full Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="registerEmail">Email Address</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="registerPassword">Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <div
                id="errorMessage"
                class="message error-message"
            ></div>


            <div
                id="successMessage"
                class="message success-message"
            ></div>


            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>


            <a
                href="index.html"
                class="home-link"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("registerName")
                    .value
                    .trim();


                const email =
                    document
                    .getElementById("registerEmail")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("registerPassword")
                    .value;


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value;


                errorMessage.style.display = "none";
                successMessage.style.display = "none";


                if (password !== confirmPassword) {

                    errorMessage.textContent =
                        "Passwords do not match.";

                    errorMessage.style.display =
                        "block";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name: name,
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        errorMessage.textContent =
                            data.message ||
                            "Registration failed.";

                        errorMessage.style.display =
                            "block";

                        return;
                    }


                    successMessage.textContent =
                        "Account created successfully! Redirecting to login...";

                    successMessage.style.display =
                        "block";


                    registerForm.reset();


                    setTimeout(
                        function() {
                            window.location.href =
                                "login.html";
                        },
                        1500
                    );

                } catch (error) {

                    errorMessage.textContent =
                        "Unable to connect to the server. Please make sure Flask is running.";

                    errorMessage.style.display =
                        "block";
                }

            }
        );

    </script>

</body>
</html>
