<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoalMate Notifications</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            margin-bottom: 12px;
        }

        .header a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .notifications-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification-card {
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 12px;
        }

        .notification-card h3 {
            color: #1e293b;
            margin-bottom: 7px;
        }

        .notification-card p {
            color: #64748b;
            line-height: 1.5;
        }

        .empty-message {
            color: #64748b;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <h1>Notifications</h1>

            <p>
                Stay updated with your goals and tasks
            </p>

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>


        <!-- NOTIFICATIONS -->
        <div class="section">

            <h2>Your Notifications</h2>

            <div
                id="notificationsContainer"
                class="notifications-container"
            >

                <p class="empty-message">
                    No notifications yet.
                </p>

            </div>

        </div>

    </div>


    <script src="notifications.js"></script>

</body>

</html>
