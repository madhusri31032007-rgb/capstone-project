<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoalMate Achievements</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            margin-bottom: 12px;
        }

        .header a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .summary-card h3 {
            color: #64748b;
            margin-bottom: 10px;
        }

        .summary-number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .achievements-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .achievement-card {
            border: 1px solid #e2e8f0;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
        }

        .achievement-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .achievement-card h3 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .achievement-card p {
            color: #64748b;
            line-height: 1.5;
        }

        .empty-message {
            color: #64748b;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <h1>Achievements</h1>

            <p>
                View your completed goals and earned achievements
            </p>

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>


        <!-- SUMMARY -->
        <div class="summary">

            <div class="summary-card">

                <h3>Total Achievements</h3>

                <div
                    id="totalAchievements"
                    class="summary-number"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <h3>Completed Goals</h3>

                <div
                    id="completedGoals"
                    class="summary-number"
                >
                    0
                </div>

            </div>

        </div>


        <!-- ACHIEVEMENTS -->
        <div class="section">

            <h2>Your Achievements</h2>

            <div
                id="achievementsContainer"
                class="achievements-container"
            >

                <p class="empty-message">
                    No achievements yet. Complete your goals to earn achievements!
                </p>

            </div>

        </div>

    </div>


    <script src="achievements.js"></script>

</body>

</html>
