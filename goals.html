<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goals - Personal Goal Achievement Platform</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #172554;
            min-height: 100vh;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .logout-button {
            border: none;
            background: white;
            color: #172554;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #e2e8f0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
            font-size: 15px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #172554;
            box-shadow: 0 0 0 3px rgba(23, 37, 84, 0.1);
        }

        .add-button {
            margin-top: 20px;
            padding: 13px 24px;
            border: none;
            border-radius: 9px;
            background: #172554;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1e3a8a;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
        }

        .success-message {
            color: #166534;
            background: #dcfce7;
        }

        .error-message {
            color: #b91c1c;
            background: #fee2e2;
        }

        .goal-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .goal-card:last-child {
            margin-bottom: 0;
        }

        .goal-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .goal-title {
            font-size: 19px;
            font-weight: bold;
            color: #172554;
            margin-bottom: 8px;
        }

        .goal-description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .goal-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .detail {
            background: #f1f5f9;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 12px;
            color: #475569;
        }

        .status {
            background: #fef3c7;
            color: #92400e;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .delete-button {
            margin-top: 16px;
            padding: 8px 14px;
            border: none;
            border-radius: 7px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 16px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                justify-content: center;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .goal-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Personal Goal Platform
        </div>

        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/goals.html">Goals</a>
            <a href="/tasks.html">Tasks</a>
            <a href="/progress.html">Progress</a>
            <a href="/achievements.html">Achievements</a>
            <a href="/profile.html">Profile</a>
            <a href="/settings.html">Settings</a>

            <button
                class="logout-button"
                onclick="logoutUser()">
                Logout
            </button>
        </div>

    </nav>


    <main class="container">

        <div class="page-header">
            <h1>My Goals</h1>
            <p>Create and manage your personal goals.</p>
        </div>


        <section class="card">

            <h2>Add New Goal</h2>

            <form id="goalForm">

                <div class="form-grid">

                    <div class="form-group full-width">
                        <label for="title">
                            Goal Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter your goal"
                            required>
                    </div>


                    <div class="form-group full-width">
                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Describe your goal">
                        </textarea>
                    </div>


                    <div class="form-group">
                        <label for="priority">
                            Priority
                        </label>

                        <select id="priority">
                            <option value="">
                                Select Priority
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="deadline">
                            Deadline
                        </label>

                        <input
                            type="date"
                            id="deadline">
                    </div>

                </div>


                <button
                    type="submit"
                    class="add-button"
                    id="addButton">
                    Add Goal
                </button>


                <div
                    id="message"
                    class="message">
                </div>

            </form>

        </section>


        <section class="card">

            <h2>Your Goals</h2>

            <div id="goalsList">
                Loading goals...
            </div>

        </section>

    </main>


    <script>

        const goalForm = document.getElementById("goalForm");
        const goalsList = document.getElementById("goalsList");
        const message = document.getElementById("message");
        const addButton = document.getElementById("addButton");


        function showMessage(text, type) {

            message.textContent = text;

            message.className = "message " + type;

            message.style.display = "block";

            setTimeout(function() {

                message.style.display = "none";

            }, 3000);
        }


        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        async function loadGoals() {

            try {

                const response = await fetch("/api/goals");

                const data = await response.json();


                if (!response.ok) {

                    if (response.status === 401) {

                        window.location.href = "/login.html";

                        return;
                    }

                    throw new Error(
                        data.message || "Unable to load goals."
                    );
                }


                displayGoals(data.goals);

            } catch (error) {

                console.error(error);

                goalsList.innerHTML =
                    '<div class="empty-message">' +
                    'Unable to load goals. Please try again.' +
                    '</div>';
            }
        }


        function displayGoals(goals) {

            if (!goals || goals.length === 0) {

                goalsList.innerHTML =
                    '<div class="empty-message">' +
                    'No goals added yet. Create your first goal above.' +
                    '</div>';

                return;
            }


            goalsList.innerHTML = "";


            goals.forEach(function(goal) {

                const card = document.createElement("div");

                card.className = "goal-card";


                const title = document.createElement("div");

                title.className = "goal-title";

                title.textContent = goal.title || "";

                card.appendChild(title);


                const description = document.createElement("div");

                description.className = "goal-description";

                description.textContent =
                    goal.description || "No description provided";

                card.appendChild(description);


                const details = document.createElement("div");

                details.className = "goal-details";


                const priority = document.createElement("span");

                priority.className = "detail";

                priority.textContent =
                    "Priority: " + (goal.priority || "Not set");

                details.appendChild(priority);


                const deadline = document.createElement("span");

                deadline.className = "detail";

                deadline.textContent =
                    "Deadline: " + (goal.deadline || "No deadline");

                details.appendChild(deadline);


                card.appendChild(details);


                const status = document.createElement("span");

                status.className = "status";

                status.textContent =
                    goal.status || "Not Started";

                card.appendChild(status);


                const deleteButton =
                    document.createElement("button");

                deleteButton.className = "delete-button";

                deleteButton.textContent = "Delete Goal";


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteGoal(goal.id);

                    }
                );


                card.appendChild(deleteButton);

                goalsList.appendChild(card);

            });
        }


        goalForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                addButton.disabled = true;

                addButton.textContent = "Adding...";


                const goalData = {

                    title:
                        document.getElementById("title").value.trim(),

                    description:
                        document.getElementById("description").value.trim(),

                    priority:
                        document.getElementById("priority").value,

                    deadline:
                        document.getElementById("deadline").value

                };


                try {

                    const response = await fetch(
                        "/api/goals",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(goalData)
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        if (response.status === 401) {

                            window.location.href =
                                "/login.html";

                            return;
                        }

                        throw new Error(
                            data.message ||
                            "Unable to add goal."
                        );
                    }


                    showMessage(
                        data.message ||
                        "Goal added successfully!",
                        "success-message"
                    );


                    goalForm.reset();

                    await loadGoals();

                } catch (error) {

                    console.error(error);

                    showMessage(
                        error.message ||
                        "Unable to add goal.",
                        "error-message"
                    );

                } finally {

                    addButton.disabled = false;

                    addButton.textContent = "Add Goal";
                }

            }
        );


        async function deleteGoal(goalId) {

            const confirmed = confirm(
                "Are you sure you want to delete this goal?"
            );


            if (!confirmed) {
                return;
            }


            try {

                const response = await fetch(
                    "/api/goals/" + goalId,
                    {
                        method: "DELETE"
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    if (response.status === 401) {

                        window.location.href =
                            "/login.html";

                        return;
                    }

                    throw new Error(
                        data.message ||
                        "Unable to delete goal."
                    );
                }


                showMessage(
                    data.message ||
                    "Goal deleted successfully.",
                    "success-message"
                );


                await loadGoals();

            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Unable to delete goal.",
                    "error-message"
                );
            }
        }


        async function logoutUser() {

            try {

                const response = await fetch(
                    "/api/logout",
                    {
                        method: "POST"
                    }
                );


                const data = await response.json();


                localStorage.removeItem("loggedIn");

                localStorage.removeItem("user");


                alert(
                    data.message ||
                    "Logged out successfully!"
                );


            } catch (error) {

                console.error(error);

                localStorage.removeItem("loggedIn");

                localStorage.removeItem("user");

            }


            window.location.href = "/login.html";
        }


        loadGoals();

    </script>

</body>
</html>
